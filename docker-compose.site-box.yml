# Dokploy site-box collector (use THIS file as Compose Path).
#
# Dokploy always runs from the git repo root. Do NOT use
# sites/templates/site-box/docker-compose.yml as Compose Path.
#
# Runtime config lives in named volume `noc_sitebox_data` (NOT a bind to
# Dokploy's code/ tree). Dokploy replaces code/ on redeploy; bind mounts
# go stale and Console sees an empty /data → "config.alloy: No such file".
# Console seeds toolkit + config.alloy into the volume on boot; Alloy mounts
# the same volume at /etc/alloy.
#
# Dokploy → Compose Path:
#   docker-compose.site-box.yml
#
# Environment (required): CENTRAL_REMOTE_WRITE_URL, CF_ACCESS_CLIENT_ID,
# CF_ACCESS_CLIENT_SECRET, SITE_NAME, HOST_DEVICE_ID, …

x-collector-env: &collector-env
  CENTRAL_REMOTE_WRITE_URL: ${CENTRAL_REMOTE_WRITE_URL:-}
  CF_ACCESS_CLIENT_ID: ${CF_ACCESS_CLIENT_ID:-}
  CF_ACCESS_CLIENT_SECRET: ${CF_ACCESS_CLIENT_SECRET:-}
  SITE_NAME: ${SITE_NAME:-site-1}
  HOST_DEVICE_ID: ${HOST_DEVICE_ID:-site-1-nuc}
  PING_TARGET_1: ${PING_TARGET_1:-1.1.1.1}
  PING_TARGET_2: ${PING_TARGET_2:-139.99.88.174}
  NOC_API_URL: ${NOC_API_URL:-}
  COLLECTOR_TOKEN: ${COLLECTOR_TOKEN:-}
  SCRAPE_INTERVAL_SEC: ${SCRAPE_INTERVAL_SEC:-15}
  SYNC_INTERVAL_SEC: ${SYNC_INTERVAL_SEC:-90}

services:
  collector-console:
    build:
      context: ./sites/templates/site-box
      dockerfile: collector-console/Dockerfile
      args:
        NODE_IMAGE: public.ecr.aws/docker/library/node:20-bookworm-slim
    container_name: noc_collector_console
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      # Survives Dokploy code/ replacement (generated config.alloy + snmp/blackbox)
      - noc_sitebox_data:/data
      - noc_sitebox_state:/state
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      <<: *collector-env
      DATA_DIR: /data
      STATE_DIR: /state
      SYNC_INTERVAL_SEC: ${SYNC_INTERVAL_SEC:-90}
      PORT: "8090"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8090/api/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 25s

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: noc_site_alloy
    restart: unless-stopped
    pid: host
    cap_add:
      - NET_RAW
    network_mode: host
    environment:
      <<: *collector-env
    volumes:
      # Same volume Console writes — blackbox.yml, snmp.yml, config.alloy
      - noc_sitebox_data:/etc/alloy:ro
      - /:/rootfs:ro
      - noc_speedtest_textfile:/var/lib/node_exporter/textfile
    working_dir: /etc/alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345
    depends_on:
      collector-console:
        condition: service_healthy

  speedtest:
    build:
      context: ./sites/templates/site-box
      dockerfile: Dockerfile.speedtest
    container_name: noc_site_speedtest
    restart: unless-stopped
    network_mode: host
    environment:
      SITE_NAME: ${SITE_NAME:-site-1}
      TEXTFILE_DIR: /textfile
      INTERVAL_SEC: ${SPEEDTEST_INTERVAL_SEC:-900}
    volumes:
      - noc_speedtest_textfile:/textfile

volumes:
  noc_sitebox_state:
  noc_sitebox_data:
  noc_speedtest_textfile:
