groups:
  - name: noc-site-alerts
    rules:
      # Primary: internet / uplink — both WAN checks must fail (quorum).
      # Requires ICMP scrape ≤30s (repo Alloy template: 15s). 60s ICMP + short window = false downs.
      - alert: SiteUplinkDown
        expr: |
          (
            (
              (probe_success{check="wan_dns"} == 0)
              or
              absent_over_time(probe_success{check="wan_dns"}[90s])
            )
            and on (site)
            (
              (probe_success{check="wan_vps"} == 0)
              or
              absent_over_time(probe_success{check="wan_vps"}[90s])
            )
          )
        for: 2m
        labels:
          severity: critical
          site: "{{ $labels.site }}"
        annotations:
          summary: "The internet is down at {{ $labels.site }}. Both checks failed. Check the uplink and the collector."

      - alert: SiteWebsiteDown
        expr: |
          (
            (probe_success{check="website"} == 0)
            or
            absent_over_time(probe_success{check="website"}[2m])
          )
        for: 1m
        labels:
          severity: critical
          site: "{{ $labels.site }}"
        annotations:
          summary: "A website at {{ $labels.site }} is not responding. Check that the address is correct and the site is up."

      # Secondary: collector box offline or silent
      - alert: SiteCollectorDown
        expr: |
          (
            (up{job=~"site_host|integrations/unix"} == 0)
            or
            absent_over_time(up{job=~"site_host|integrations/unix"}[90s])
            or
            absent_over_time(node_memory_MemAvailable_bytes{role="site-box"}[90s])
          )
        for: 2m
        labels:
          severity: critical
          site: "{{ $labels.site }}"
        annotations:
          summary: "The collector at {{ $labels.site }} is offline. Device checks are paused. Check power and the network on the collector, then open Collector Console."

      - alert: SiteLocalDeviceDown
        # Both SNMP and the device ping must be failing, and the collector host must still be up.
        expr: |
          (
            (
              (snmp_up{site=~".+"} == 0)
              or
              (
                (up{job="site_snmp_if_mib"} == 0)
                unless on(site, device) (snmp_up == 1)
              )
            )
            and on(site, device)
            (
              (probe_success{check="device_ping"} == 0)
              or
              absent_over_time(probe_success{check="device_ping"}[90s])
            )
          )
          and on(site)
          (up{job=~"site_host|integrations/unix"} == 1)
        for: 2m
        labels:
          severity: critical
          site: "{{ $labels.site }}"
          device: "{{ $labels.device }}"
        annotations:
          summary: "{{ $labels.device }} is not answering ping or SNMP. Check power and the network cable."

      - alert: SiteSnmpDegraded
        expr: |
          (
            (
              (snmp_up{site=~".+"} == 0)
              or
              (
                (up{job="site_snmp_if_mib"} == 0)
                unless on(site, device) (snmp_up == 1)
              )
            )
            and on(site, device)
            (probe_success{check="device_ping"} == 1)
          )
        for: 2m
        labels:
          severity: warning
          site: "{{ $labels.site }}"
          device: "{{ $labels.device }}"
        annotations:
          summary: "{{ $labels.device }} is online, but SNMP is not answering. Check the SNMP community and that UDP port 161 is allowed, then use Force apply on the collector."
