groups:
  - name: noc-site-alerts
    rules:
      # Primary: internet / uplink — both WAN checks must fail (quorum).
      # Requires ICMP scrape ≤30s (repo Alloy template: 15s). 60s ICMP + short window = false downs.
      - alert: SiteUplinkDown
        expr: |
          (
            (
              (probe_success{check="wan_dns"} == 0)
              or
              absent_over_time(probe_success{check="wan_dns"}[90s])
            )
            and on (site)
            (
              (probe_success{check="wan_vps"} == 0)
              or
              absent_over_time(probe_success{check="wan_vps"}[90s])
            )
          )
        for: 2m
        labels:
          severity: critical
          site: "{{ $labels.site }}"
        annotations:
          summary: "Internet down at {{ $labels.site }} (both wan_dns and wan_vps)"

      - alert: SiteWebsiteDown
        expr: |
          (
            (probe_success{check="website"} == 0)
            or
            absent_over_time(probe_success{check="website"}[2m])
          )
        for: 1m
        labels:
          severity: critical
          site: "{{ $labels.site }}"
        annotations:
          summary: "Website check failing (site={{ $labels.site }}, target={{ $labels.instance }})"

      # Secondary: collector box offline or silent
      - alert: SiteCollectorDown
        expr: |
          (
            (up{job=~"site_host|integrations/unix"} == 0)
            or
            absent_over_time(up{job=~"site_host|integrations/unix"}[90s])
            or
            absent_over_time(node_memory_MemAvailable_bytes{role="site-box"}[90s])
          )
        for: 2m
        labels:
          severity: critical
          site: "{{ $labels.site }}"
        annotations:
          summary: "Collector offline at {{ $labels.site }} (device={{ $labels.device }}, instance={{ $labels.instance }})"

      - alert: SiteLocalDeviceDown
        # Prefer snmp_up; also site_snmp_if_mib scrape up (Alloy may omit snmp_up); legacy integrations/snmp last.
        expr: |
          (
            (snmp_up{site=~".+"} == 0)
            or
            (
              absent_over_time(snmp_up{site=~".+"}[5m])
              unless on(device) (up{job="site_snmp_if_mib"} == 1)
              unless on(device) (up{job=~"integrations/snmp/.*"} == 1)
            )
            or
            (
              (up{job="site_snmp_if_mib"} == 0)
              unless on(device) (snmp_up)
            )
            or
            (
              (up{job=~"integrations/snmp/.*"} == 0)
              unless on(device) (snmp_up)
              unless on(device) (up{job="site_snmp_if_mib"})
            )
          )
        for: 2m
        labels:
          severity: warning
          site: "{{ $labels.site }}"
          device: "{{ $labels.device }}"
        annotations:
          summary: "Local device SNMP check failing (site={{ $labels.site }}, device={{ $labels.device }})"
