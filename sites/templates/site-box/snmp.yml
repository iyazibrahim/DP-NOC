# SNMPv2c config for Grafana Alloy prometheus.exporter.snmp
# Contract: grafana/alloy:v1.5.1 ONLY
# Do NOT use config_merge_strategy — unsupported on Alloy v1.5.1 (causes crash / no SNMP data).
# Must include auths + modules.*.metrics (walk-only is not enough for usable series).
#
# generate-config.sh rewrites the auths: block from devices.json:
#   default_v2 / public_v2 = Console Setup default community
#   auth_<deviceId>        = per-device snmpCommunity or the default
# Modules below are preserved across regenerate (auths only rewritten).
# noc-snmp-no-lookups: do not add lookups. snmp_exporter v0.26.0 panics in
# pduValueAsString while turning a lookup into a label, and that panic kills Alloy.
#
# Each network device scrapes if_mib always, plus one vendor module when type/vendor matches
# (see generate-config.sh). After template changes: Force-apply collectors / redeploy site-box.

auths:
  default_v2:
    community: public
    security_level: noAuthNoPriv
    version: 2
  public_v2:
    community: public
    security_level: noAuthNoPriv
    version: 2

modules:
  # noc-snmp-no-lookups — must live inside modules: so generate-config copies it onto the volume.
  if_mib:
    walk:
      - 1.3.6.1.2.1.2.2.1.2     # ifDescr
      - 1.3.6.1.2.1.2.2.1.8     # ifOperStatus
      - 1.3.6.1.2.1.2.2.1.5     # ifSpeed
      - 1.3.6.1.2.1.2.2.1.10    # ifInOctets (32-bit; Omada EAPs have this and not ifHCInOctets)
      - 1.3.6.1.2.1.2.2.1.16    # ifOutOctets
      - 1.3.6.1.2.1.2.2.1.13    # ifInDiscards
      - 1.3.6.1.2.1.2.2.1.14    # ifInErrors
      - 1.3.6.1.2.1.2.2.1.19    # ifOutDiscards
      - 1.3.6.1.2.1.2.2.1.20    # ifOutErrors
      - 1.3.6.1.2.1.31.1.1.1.1  # ifName
      - 1.3.6.1.2.1.31.1.1.1.6  # ifHCInOctets
      - 1.3.6.1.2.1.31.1.1.1.10 # ifHCOutOctets
      - 1.3.6.1.2.1.31.1.1.1.15 # ifHighSpeed (Mb)
    metrics:
      - name: ifDescr
        oid: 1.3.6.1.2.1.2.2.1.2
        type: DisplayString
        help: A textual description of the interface
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifOperStatus
        oid: 1.3.6.1.2.1.2.2.1.8
        type: gauge
        help: The current operational state of the interface
        indexes:
          - labelname: ifIndex
            type: gauge
        enum_values:
          1: up
          2: down
          3: testing
          4: unknown
          5: dormant
          6: notPresent
          7: lowerLayerDown
      - name: ifSpeed
        oid: 1.3.6.1.2.1.2.2.1.5
        type: gauge
        help: Estimate of the interface bandwidth in bits per second
        indexes:
          - labelname: ifIndex
            type: gauge
      # if-mib-32bit-octets — EAP/Omada agents answer these and omit ifHC* counters.
      - name: ifInOctets
        oid: 1.3.6.1.2.1.2.2.1.10
        type: counter
        help: 32-bit octets received on the interface
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifOutOctets
        oid: 1.3.6.1.2.1.2.2.1.16
        type: counter
        help: 32-bit octets sent on the interface
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifInDiscards
        oid: 1.3.6.1.2.1.2.2.1.13
        type: counter
        help: Inbound packets discarded
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifInErrors
        oid: 1.3.6.1.2.1.2.2.1.14
        type: counter
        help: Inbound packets with errors
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifOutDiscards
        oid: 1.3.6.1.2.1.2.2.1.19
        type: counter
        help: Outbound packets discarded
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifOutErrors
        oid: 1.3.6.1.2.1.2.2.1.20
        type: counter
        help: Outbound packets with errors
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifName
        oid: 1.3.6.1.2.1.31.1.1.1.1
        type: DisplayString
        help: Interface name
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifHCInOctets
        oid: 1.3.6.1.2.1.31.1.1.1.6
        type: counter
        help: The total number of octets received on the interface
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifHCOutOctets
        oid: 1.3.6.1.2.1.31.1.1.1.10
        type: counter
        help: The total number of octets transmitted out of the interface
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifHighSpeed
        oid: 1.3.6.1.2.1.31.1.1.1.15
        type: gauge
        help: Interface speed in megabits per second
        indexes:
          - labelname: ifIndex
            type: gauge

  # FortiGate system health (FORTINET-FORTIGATE-MIB)
  fortigate_health:
    walk:
      - 1.3.6.1.4.1.12356.101.4.1.3   # fgSysCpuUsage
      - 1.3.6.1.4.1.12356.101.4.1.4   # fgSysMemUsage
      - 1.3.6.1.4.1.12356.101.4.1.5   # fgSysMemCapacity (KB)
      - 1.3.6.1.4.1.12356.101.4.1.6   # fgSysDiskUsage
      - 1.3.6.1.4.1.12356.101.4.1.7   # fgSysDiskCapacity (MB)
      - 1.3.6.1.4.1.12356.101.4.1.8   # fgSysSesCount
      - 1.3.6.1.4.1.12356.101.4.1.9   # fgSysLowMemUsage
      - 1.3.6.1.4.1.12356.101.4.1.10  # fgSysSesRate
      - 1.3.6.1.4.1.12356.101.4.4.2.1.2  # fgProcessorUsage (integer index only)
      - 1.3.6.1.2.1.1.3.0             # sysUpTime
    metrics:
      - name: fgSysCpuUsage
        oid: 1.3.6.1.4.1.12356.101.4.1.3
        type: gauge
        help: FortiGate CPU usage percent
      - name: fgSysMemUsage
        oid: 1.3.6.1.4.1.12356.101.4.1.4
        type: gauge
        help: FortiGate memory usage percent
      - name: fgSysMemCapacity
        oid: 1.3.6.1.4.1.12356.101.4.1.5
        type: gauge
        help: FortiGate memory capacity in kilobytes
      - name: fgSysDiskUsage
        oid: 1.3.6.1.4.1.12356.101.4.1.6
        type: gauge
        help: FortiGate disk usage percent
      - name: fgSysDiskCapacity
        oid: 1.3.6.1.4.1.12356.101.4.1.7
        type: gauge
        help: FortiGate disk capacity in megabytes
      - name: fgSysSesCount
        oid: 1.3.6.1.4.1.12356.101.4.1.8
        type: gauge
        help: FortiGate active session count
      - name: fgSysLowMemUsage
        oid: 1.3.6.1.4.1.12356.101.4.1.9
        type: gauge
        help: FortiGate low-memory usage percent
      - name: fgSysSesRate
        oid: 1.3.6.1.4.1.12356.101.4.1.10
        type: gauge
        help: FortiGate session setup rate
      - name: fgProcessorUsage
        oid: 1.3.6.1.4.1.12356.101.4.4.2.1.2
        type: gauge
        help: FortiGate per-core CPU percent
        indexes:
          - labelname: fgProcessorIndex
            type: gauge
      - name: sysUpTime
        oid: 1.3.6.1.2.1.1.3.0
        type: gauge
        help: SNMP sysUpTime in TimeTicks (hundredths of a second)

  # Maipu / portable switch health via HOST-RESOURCES-MIB
  # Enterprise Maipu OIDs vary by model — confirm with snmpwalk and extend this module.
  maipu_health:
    walk:
      - 1.3.6.1.2.1.25.3.3.1.2  # hrProcessorLoad
      - 1.3.6.1.2.1.25.2.3.1.2  # hrStorageType
      - 1.3.6.1.2.1.25.2.3.1.5  # hrStorageSize
      - 1.3.6.1.2.1.25.2.3.1.6  # hrStorageUsed
    metrics:
      - name: hrProcessorLoad
        oid: 1.3.6.1.2.1.25.3.3.1.2
        type: gauge
        help: The average percentage of CPU load
        indexes:
          - labelname: hrDeviceIndex
            type: gauge
      - name: hrStorageType
        oid: 1.3.6.1.2.1.25.2.3.1.2
        type: DisplayString
        help: Storage type OID
        indexes:
          - labelname: hrStorageIndex
            type: gauge
      - name: hrStorageSize
        oid: 1.3.6.1.2.1.25.2.3.1.5
        type: gauge
        help: Storage size in allocation units
        indexes:
          - labelname: hrStorageIndex
            type: gauge
      - name: hrStorageUsed
        oid: 1.3.6.1.2.1.25.2.3.1.6
        type: gauge
        help: Storage used in allocation units
        indexes:
          - labelname: hrStorageIndex
            type: gauge

  # Cambium cnPilot E-series — LIGHT health only (must finish inside ~15s scrape).
  # Do NOT put cambiumClientTable here; a full station walk timed out Alloy and
  # cascaded SNMP failures across firewall/switch/NAS. Station list = cambium_clients.
  cambium_ap_health:
    walk:
      - 1.3.6.1.4.1.17713.22.1.1.1.6.0   # cambiumAPCPUUtilization.0
      - 1.3.6.1.4.1.17713.22.1.1.1.14.0  # cambiumAPTotalClients.0
    metrics:
      - name: cambiumAPCPUUtilization
        oid: 1.3.6.1.4.1.17713.22.1.1.1.6.0
        type: gauge
        help: Cambium AP CPU utilization percent (E-series scalar .0)
      - name: cambiumAPTotalClients
        oid: 1.3.6.1.4.1.17713.22.1.1.1.14.0
        type: gauge
        help: Cambium AP total associated clients (E-series scalar .0)

  # Cambium station table — scraped on a SLOW separate job (60s), not the health path.
  # Walk the whole entry once (GETBULK) instead of many column roots — fewer round-trips.
  cambium_clients:
    walk:
      - 1.3.6.1.4.1.17713.22.1.3.1
    max_repetitions: 5
    retries: 1
    timeout: 10s
    metrics:
      - name: cambiumClientInfo
        oid: 1.3.6.1.4.1.17713.22.1.3.1.1
        type: gauge
        help: Cambium associated client present (value = clientIndex)
        indexes:
          - labelname: clientIndex
            type: gauge
      - name: cambiumClientSNR
        oid: 1.3.6.1.4.1.17713.22.1.3.1.11
        type: gauge
        help: Cambium client SNR
        indexes:
          - labelname: clientIndex
            type: gauge
      - name: cambiumClientTxDataBytes
        oid: 1.3.6.1.4.1.17713.22.1.3.1.14
        type: counter
        help: Cambium client tx data bytes
        indexes:
          - labelname: clientIndex
            type: gauge
      - name: cambiumClientRxDataBytes
        oid: 1.3.6.1.4.1.17713.22.1.3.1.16
        type: counter
        help: Cambium client rx data bytes
        indexes:
          - labelname: clientIndex
            type: gauge

  # omada-numeric-health — client count plus numeric HOST-RESOURCES and uptime (15s path).
  # No text columns and no station walk on this job.
  omada_ap_health:
    walk:
      - 1.3.6.1.4.1.11863.10.1.1.1  # client count (verify on device)
      - 1.3.6.1.2.1.25.3.3.1.2      # hrProcessorLoad
      - 1.3.6.1.2.1.25.2.3.1.5      # hrStorageSize
      - 1.3.6.1.2.1.25.2.3.1.6      # hrStorageUsed
      - 1.3.6.1.2.1.1.3.0           # sysUpTime
    metrics:
      - name: omadaClientCount
        oid: 1.3.6.1.4.1.11863.10.1.1.1
        type: gauge
        help: Omada/TP-Link EAP client count (verify OID on model/firmware)
      - name: hrProcessorLoad
        oid: 1.3.6.1.2.1.25.3.3.1.2
        type: gauge
        help: The average percentage of CPU load
        indexes:
          - labelname: hrDeviceIndex
            type: gauge
      - name: hrStorageSize
        oid: 1.3.6.1.2.1.25.2.3.1.5
        type: gauge
        help: Storage size in allocation units
        indexes:
          - labelname: hrStorageIndex
            type: gauge
      - name: hrStorageUsed
        oid: 1.3.6.1.2.1.25.2.3.1.6
        type: gauge
        help: Storage used in allocation units
        indexes:
          - labelname: hrStorageIndex
            type: gauge
      - name: sysUpTime
        oid: 1.3.6.1.2.1.1.3.0
        type: gauge
        help: SNMP sysUpTime in TimeTicks (hundredths of a second)

  # Omada MAC table — slow job only (optional / firmware dependent).
  omada_clients:
    walk:
      - 1.3.6.1.4.1.11863.10.1.1.2.1.1
      - 1.3.6.1.4.1.11863.10.1.1.2.1.2
    max_repetitions: 10
    timeout: 25s
    metrics:
      - name: omadaClientInfo
        oid: 1.3.6.1.4.1.11863.10.1.1.2.1.1
        type: gauge
        help: Omada associated client present (value = clientIndex)
        indexes:
          - labelname: clientIndex
            type: gauge

  # Synology DSM (SYNOLOGY-SYSTEM/DISK/RAID-MIB + HOST-RESOURCES CPU + UCD memory).
  # Type nas + vendor synology (or empty/generic). RAID sizes are MIB Counter64 but treated
  # as gauges so PromQL can use current free/total without rate().
  synology_health:
    walk:
      - 1.3.6.1.4.1.6574.1.1.0     # synoSystemStatus
      - 1.3.6.1.4.1.6574.1.2.0     # synoTemperature
      - 1.3.6.1.4.1.6574.2.1.1.5   # synoDiskStatus
      - 1.3.6.1.4.1.6574.2.1.1.6   # synoDiskTemperature
      - 1.3.6.1.4.1.6574.3.1.1.3   # synoRaidStatus
      - 1.3.6.1.4.1.6574.3.1.1.4   # synoRaidFreeSize
      - 1.3.6.1.4.1.6574.3.1.1.5   # synoRaidTotalSize
      - 1.3.6.1.2.1.25.3.3.1.2     # hrProcessorLoad
      - 1.3.6.1.2.1.25.2.3.1.2     # hrStorageType
      - 1.3.6.1.2.1.25.2.3.1.3     # hrStorageDescr
      - 1.3.6.1.2.1.25.2.3.1.5     # hrStorageSize
      - 1.3.6.1.2.1.25.2.3.1.6     # hrStorageUsed
      - 1.3.6.1.4.1.2021.4.5.0     # memTotalReal (kB)
      - 1.3.6.1.4.1.2021.4.6.0     # memAvailReal (kB)
    metrics:
      - name: synoSystemStatus
        oid: 1.3.6.1.4.1.6574.1.1.0
        type: gauge
        help: Synology system status (1=Normal, 2=Failed)
      - name: synoTemperature
        oid: 1.3.6.1.4.1.6574.1.2.0
        type: gauge
        help: Synology system temperature Celsius
      - name: synoDiskStatus
        oid: 1.3.6.1.4.1.6574.2.1.1.5
        type: gauge
        help: Synology disk status (1=Normal, 4=SystemPartitionFailed, 5=Crashed)
        indexes:
          - labelname: synoDiskIndex
            type: gauge
        enum_values:
          1: normal
          2: initialized
          3: notInitialized
          4: systemPartitionFailed
          5: crashed
      - name: synoDiskTemperature
        oid: 1.3.6.1.4.1.6574.2.1.1.6
        type: gauge
        help: Synology disk temperature Celsius
        indexes:
          - labelname: synoDiskIndex
            type: gauge
      - name: synoRaidStatus
        oid: 1.3.6.1.4.1.6574.3.1.1.3
        type: gauge
        help: Synology RAID status (1=Normal, 11=Degrade, 12=Crashed)
        indexes:
          - labelname: synoRaidIndex
            type: gauge
        enum_values:
          1: normal
          2: repairing
          3: migrating
          4: expanding
          5: deleting
          6: creating
          7: raidSyncing
          8: raidParityChecking
          9: raidAssembling
          10: canceling
          11: degrade
          12: crashed
          13: dataScrubbing
      - name: synoRaidFreeSize
        oid: 1.3.6.1.4.1.6574.3.1.1.4
        type: gauge
        help: Synology RAID free size (bytes)
        indexes:
          - labelname: synoRaidIndex
            type: gauge
      - name: synoRaidTotalSize
        oid: 1.3.6.1.4.1.6574.3.1.1.5
        type: gauge
        help: Synology RAID total size (bytes)
        indexes:
          - labelname: synoRaidIndex
            type: gauge
      - name: hrProcessorLoad
        oid: 1.3.6.1.2.1.25.3.3.1.2
        type: gauge
        help: The average percentage of CPU load
        indexes:
          - labelname: hrDeviceIndex
            type: gauge
      - name: hrStorageType
        oid: 1.3.6.1.2.1.25.2.3.1.2
        type: DisplayString
        help: Storage type OID
        indexes:
          - labelname: hrStorageIndex
            type: gauge
      - name: hrStorageDescr
        oid: 1.3.6.1.2.1.25.2.3.1.3
        type: DisplayString
        help: Storage description (e.g. /volume1)
        indexes:
          - labelname: hrStorageIndex
            type: gauge
      - name: hrStorageSize
        oid: 1.3.6.1.2.1.25.2.3.1.5
        type: gauge
        help: Storage size in allocation units
        indexes:
          - labelname: hrStorageIndex
            type: gauge
      - name: hrStorageUsed
        oid: 1.3.6.1.2.1.25.2.3.1.6
        type: gauge
        help: Storage used in allocation units
        indexes:
          - labelname: hrStorageIndex
            type: gauge
      - name: memTotalReal
        oid: 1.3.6.1.4.1.2021.4.5.0
        type: gauge
        help: Total real memory kB (UCD-SNMP-MIB)
      - name: memAvailReal
        oid: 1.3.6.1.4.1.2021.4.6.0
        type: gauge
        help: Available real memory kB (UCD-SNMP-MIB)
